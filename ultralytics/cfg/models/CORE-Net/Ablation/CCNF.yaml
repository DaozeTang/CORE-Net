# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
ch: 6
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []] # 0
  - [-1, 1, Multiin, [1]] # 1
  - [-2, 1, Multiin, [2]] # 2

  # double stream backbone
  # Visible branch
  - [1, 1, Conv, [32, 3, 2]] # 3-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 4-P2/4
  - [-1, 2, C3k2, [128, False, 0.25]] # 5
  
  # Infrared branch
  - [2, 1, Conv, [32, 3, 2]] # 6-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 7-P2/4
  - [-1, 2, C3k2, [128, False, 0.25]] # 8

  - [[5, 8], 1, Concat, [1]] # 9 p2 concat

  - [[5, 9], 1, Concat, [1]] # 10 rgb
  - [[8, 9], 1, Concat, [1]] # 11 ir

  - [10, 1, Conv, [128, 3, 2]] # 12-P3/8
  - [-1, 2, C3k2, [256, False, 0.25]] # 13
  
  - [11, 1, Conv, [128, 3, 2]] # 14-P3/8  # infrared
  - [-1, 2, C3k2, [256, False, 0.25]] # 15 infrared

  - [[13, 15], 1, Concat, [1]] # 16 p3 concat

  - [[13, 16], 1, Concat, [1]] # 17 rgb 
  - [[15, 16], 1, Concat, [1]] # 18 ir

  - [17, 1, Conv, [256, 3, 2]] # 19-P4/16
  - [-1, 2, C3k2, [256, True]] # 20
  
  - [18, 1, Conv, [256, 3, 2]] # 21-P4/16
  - [-1, 2, C3k2, [256, True]] # 22 infrared

  - [[20, 22], 1, Concat, [1]] # 23 p4 concat

  - [[20, 23], 1, Concat, [1]] # 24 rgb 
  - [[22, 23], 1, Concat, [1]] # 25 ir

  - [24, 1, Conv, [512, 3, 2]] # 26-P5/32
  - [-1, 2, C3k2, [512, True]] # 27
  - [-1, 1, SPPF, [512, 5]] # 28
  - [-1, 2, C2PSA, [512]] # 29
  
  - [25, 1, Conv, [512, 3, 2]] # 30-P5/32
  - [-1, 2, C3k2, [512, True]] # 31 infrared
  - [-1, 1, SPPF, [512, 5]] # 32
  - [-1, 2, C2PSA, [512]] # 33

  - [[29, 33], 1, Concat, [1]] # 34 p5 concat

  - [[29, 34], 1, Concat, [1]] # 35 rgb 
  - [[33, 34], 1, Concat, [1]] # 36 ir
  

# YOLO11n head
head:
  - [35, 1, nn.Upsample, [None, 2, "nearest"]] # 37 rgb
  - [[-1, 23], 1, Concat, [1]] # 38 cat backbone P4
  - [-1, 2, C3k2, [256, False]] # 39

  - [36, 1, nn.Upsample, [None, 2, "nearest"]] # 40 ir
  - [[-1, 23], 1, Concat, [1]] # 41 cat backbone P4
  - [-1, 2, C3k2, [256, False]] # 42

  - [[39, 42], 1, Concat, [1]] # 43 n4 concat

  - [[39, 43], 1, Concat, [1]] # 44 rgb 
  - [[42, 43], 1, Concat, [1]] # 45 ir

  - [44, 1, nn.Upsample, [None, 2, "nearest"]] # 46 rgb
  - [[-1, 16], 1, Concat, [1]] # 47 cat backbone P3
  - [-1, 2, C3k2, [128, False]] # 48 (P3/8-small)

  - [45, 1, nn.Upsample, [None, 2, "nearest"]] # 49 ir
  - [[-1, 16], 1, Concat, [1]] # 50 cat backbone P3
  - [-1, 2, C3k2, [128, False]] # 51 (P3/8-small)

  - [[48, 51], 1, Concat, [1]] # 52 n3 concat

  - [[48, 52], 1, Concat, [1]] # 53 rgb 
  - [[51, 52], 1, Concat, [1]] # 54 ir

  - [53, 1, Conv, [128, 3, 2]] # 55 rgb
  - [[-1, 43], 1, Concat, [1]] # 56 cat head P4
  - [-1, 2, C3k2, [256, False]] # 57 (P4/16-medium)

  - [54, 1, Conv, [128, 3, 2]] # 58 ir
  - [[-1, 43], 1, Concat, [1]] # 59 cat head P4
  - [-1, 2, C3k2, [256, False]] # 60 (P4/16-medium)

  - [[57, 60], 1, Concat, [1]] # 61 n4 concat

  - [[57, 61], 1, Concat, [1]] # 62 rgb 
  - [[60, 61], 1, Concat, [1]] # 63 ir

  - [62, 1, Conv, [256, 3, 2]] # 64 rgb
  - [[-1, 34], 1, Concat, [1]] # 65 cat head P5
  - [-1, 2, C3k2, [512, True]] # 66 (P5/32-large)

  - [63, 1, Conv, [256, 3, 2]] # 67 ir
  - [[-1, 34], 1, Concat, [1]] # 68 cat head P5
  - [-1, 2, C3k2, [512, True]] # 69 (P5/32-large)

  - [[66, 69], 1, Concat, [1]] # 70 n5 concat

  - [52, 1, Conv, [256, 3, 2]] # 71
  - [61, 1, Conv, [256, 3, 2]] # 72
  - [70, 1, Conv, [256, 3, 2]] # 73

  - [[71, 72, 73], 1, Detect, [nc]] # Detect(P3, P4, P5)
